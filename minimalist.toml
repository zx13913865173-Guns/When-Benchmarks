# SDXL Base 1.0 LoRA training config — style: minimalist
# NOTE: minimalist 无文化来源归属 (prompt-conditioned generalization style)，
#       仅用于泛化对 (ink+minimalist, ukiyo-e+minimalist)，不进入 2x2 文化分类。
# Run with:
#   accelerate launch sdxl_train_network.py --config_file configs/minimalist.toml

[general]
enable_bucket = true
bucket_no_upscale = false

[model]
pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"
v2 = false
v_parameterization = false

[training]
output_dir = "../outputs/lora/minimalist"
output_name = "minimalist_sdxl"
max_train_steps = 3000
train_batch_size = 2
learning_rate = 1e-4
optimizer_type = "AdamW"
lr_scheduler = "constant"
mixed_precision = "fp16"
seed = 42
save_every_n_steps = 1000
save_model_as = "safetensors"
max_grad_norm = 1.0

[network]
network_module = "networks.lora"
network_dim = 32
network_alpha = 1.0
network_train_unet_only = false

[datasets]
resolution = 1024
[[datasets.subsets]]
image_dir = "../data/train/minimalist"
num_repeats = 1
caption_extension = ".txt"
class_tokens = "minimalist composition, large negative space, restrained palette"
